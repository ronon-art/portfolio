<script>
/* VK Mini Apps adapter: exposes a YaGames-compatible object backed by VK Bridge. */
(function(){
  var B=null,handlers={},CH=4000,lastAd=0,started=Date.now(),
      SRC=['https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@2.15.12/dist/browser.min.js','https://unpkg.com/@vkontakte/vk-bridge@2.15.12/dist/browser.min.js'];
  function load(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
  function bridge(){
    if(B)return Promise.resolve(B);
    return load(SRC[0]).catch(function(){return load(SRC[1]);}).then(function(){B=window.vkBridge;if(!B)throw new Error('no bridge');return B;});
  }
  function send(m,p){return bridge().then(function(b){return b.send(m,p||{});});}
  function timeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},ms);})]);}
  var player={
    getData:function(){
      return timeout(send('VKWebAppStorageGet',{keys:['cafe_n']}),8000).then(function(r){
        var n=+((r.keys&&r.keys[0]&&r.keys[0].value)||0);if(!n)return {};
        var ks=[];for(var i=0;i<n;i++)ks.push('cafe_'+i);
        return send('VKWebAppStorageGet',{keys:ks}).then(function(r2){
          var m={};(r2.keys||[]).forEach(function(k){m[k.key]=k.value;});
          var s='';for(var i=0;i<n;i++)s+=m['cafe_'+i]||'';
          try{return {save:JSON.parse(s)};}catch(e){return {};}
        });
      });
    },
    setData:function(d){
      var s=JSON.stringify(d.save),parts=[];for(var i=0;i<s.length;i+=CH)parts.push(s.slice(i,i+CH));
      return Promise.all(parts.map(function(p,i){return send('VKWebAppStorageSet',{key:'cafe_'+i,value:p});}))
        .then(function(){return send('VKWebAppStorageSet',{key:'cafe_n',value:String(parts.length)});});
    }
  };
  var sdk={
    on:function(ev,fn){handlers[ev]=fn;},
    features:{LoadingAPI:{ready:function(){}},GameplayAPI:{start:function(){},stop:function(){}}},
    getPlayer:function(){return Promise.resolve(player);},
    getPayments:function(){return Promise.reject(new Error('payments off'));},
    getLeaderboards:function(){return Promise.reject(new Error('leaderboards off'));},
    adv:{
      showFullscreenAdv:function(o){var c=(o&&o.callbacks)||{};
        var now=Date.now();if(now-lastAd<35000||now-started<60000){c.onClose&&c.onClose(false);return;}lastAd=now;
        timeout(send('VKWebAppCheckNativeAds',{ad_format:'interstitial'}),5000).then(function(r){
          if(!r||!r.result)throw new Error('no ad');c.onOpen&&c.onOpen();
          return send('VKWebAppShowNativeAds',{ad_format:'interstitial'});
        }).then(function(){c.onClose&&c.onClose(true);}).catch(function(e){if(c.onError)c.onError(e);else if(c.onClose)c.onClose(false);});
      },
      showRewardedVideo:function(o){var c=(o&&o.callbacks)||{};c.onOpen&&c.onOpen();
        timeout(send('VKWebAppShowNativeAds',{ad_format:'reward'}),60000).then(function(r){
          if(r&&r.result)c.onRewarded&&c.onRewarded();c.onClose&&c.onClose();
        }).catch(function(e){c.onError&&c.onError(e);});
      }
    }
  };
  window.YaGames={init:function(){
    return timeout(send('VKWebAppInit'),8000).then(function(){
      try{B.subscribe(function(e){var t=e&&e.detail&&e.detail.type;
        if(t==='VKWebAppViewHide'&&handlers.game_api_pause)handlers.game_api_pause();
        if(t==='VKWebAppViewRestore'&&handlers.game_api_resume)handlers.game_api_resume();});}catch(e){}
      return sdk;
    });
  }};
})();
</script>
<style>
@font-face{font-family:'GameFont';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/game-400.woff') format('woff')}
@font-face{font-family:'GameFont';font-weight:500;font-style:normal;font-display:swap;src:url('fonts/game-500.woff') format('woff')}
@font-face{font-family:'GameFont';font-weight:700;font-style:normal;font-display:swap;src:url('fonts/game-700.woff') format('woff')}
@font-face{font-family:'GameFont';font-weight:800;font-style:normal;font-display:swap;src:url('fonts/game-800.woff') format('woff')}
@font-face{font-family:'GameFont';font-weight:900;font-style:normal;font-display:swap;src:url('fonts/game-900.woff') format('woff')}
html,body{margin:0;padding:0;overscroll-behavior:none}
img{max-width:100%}
/* Layout: a whole valley around the café — forest to the horizon, a river, future locations under locks. HUD pills on top, Tasks / Play / Shop at the bottom. Puzzle opens as a beige doodle-patterned overlay. Single bright game look by design. */
:root{
  --bg:#2E5530; --panel:#FFF6EA; --panel-ink:#3A2619; --ink:#FFF7EE; --muted:#9A7B63;
  --accent:#FFB443; --green:#4FB35C; --red:#E05A4F; --beige:#F4E4C9;
  --font:"GameFont",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}

.hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
.pills{display:flex;gap:6px;flex-wrap:wrap;max-width:62%}
.pill{pointer-events:auto;display:flex;align-items:center;gap:6px;background:rgba(255,248,238,.94);color:var(--panel-ink);border:0;border-radius:999px;padding:4px 12px 4px 4px;font-weight:800;font-size:1rem;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(120,80,40,.35),0 6px 14px rgba(0,0,0,.18)}
.pill small{font-size:.66rem;font-weight:500;color:var(--muted);margin-left:2px}
.ico{width:28px;height:28px;flex:none;display:block}
.right{display:grid;gap:6px;justify-items:end}
.chapter{pointer-events:auto;background:rgba(255,248,238,.94);color:var(--panel-ink);border:0;border-radius:16px;padding:7px 12px;font-size:.74rem;font-weight:500;text-align:right;box-shadow:0 3px 0 rgba(120,80,40,.35),0 6px 14px rgba(0,0,0,.18)}
.chapter b{display:block;font-size:.92rem;font-weight:800}
.prog{height:7px;border-radius:4px;background:#EAD8C0;margin-top:5px;overflow:hidden;width:118px}
.prog i{display:block;height:100%;background:var(--green);transition:width .6s}
.qrow{display:flex;gap:6px}
.qbtn svg{width:22px;height:22px;display:block;margin:auto}
.qbadge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:.66rem;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.side{position:fixed;left:10px;top:calc(100px + env(safe-area-inset-top,0px));display:grid;gap:8px;z-index:5}
.qbtn.big{width:48px;height:48px;border-radius:16px}
.qbtn.big svg{width:28px;height:28px}
.fade{position:fixed;inset:0;z-index:60;background:#FFF6EA;pointer-events:none}
.toggles{display:grid;gap:8px;width:100%}
.tog{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:12px 14px;font-weight:700;border:0;color:var(--panel-ink);box-shadow:0 2px 0 #EAD6BE;font-size:.95rem}
.tog i{font-style:normal;font-size:.8rem;padding:4px 10px;border-radius:999px;background:#E5D6C4;color:#8D6E57}
.tog i.on{background:var(--green);color:#fff}
.roastbar{position:relative;width:100%;height:40px;border-radius:20px;background:linear-gradient(90deg,#E9C98E 0 33%,#B07A4F 33% 66%,#5A3420 66% 100%);overflow:hidden;box-shadow:inset 0 0 0 3px rgba(0,0,0,.1)}
.roastbar .zone{position:absolute;top:0;bottom:0;background:rgba(95,184,106,.55);border-left:2px solid #2F7A3C;border-right:2px solid #2F7A3C}
.roastbar .needle{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 0 2px #3A2619}
.worlds{display:grid;gap:10px;width:100%}
.wcard{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:10px;box-shadow:0 2px 0 #EAD6BE;text-align:left;border:0;color:var(--panel-ink)}
.wcard.cur{background:#EAF7EA;box-shadow:0 2px 0 #9BD19E}
.wcard.lock{opacity:.5}
.wcard svg{width:96px;height:auto;border-radius:12px}
.wcard b{display:block}
.wcard small{color:#8D6E57;font-size:.78rem}
.qbtn{position:relative;pointer-events:auto;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,248,238,.94);color:var(--panel-ink);font-weight:900;font-size:1.2rem;box-shadow:0 3px 0 rgba(120,80,40,.35)}

.bottom{position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:8px;z-index:5;pointer-events:none}
.rbtns{display:flex;gap:8px;align-items:flex-end}.rbtns .round{pointer-events:auto}
@media (max-width:400px){.play{padding:12px 16px!important;font-size:1.12rem!important}.round{width:64px!important;height:64px!important}}
.round{pointer-events:auto;width:70px;height:70px;border-radius:22px;border:0;background:linear-gradient(#FFF8EE,#F3DFC4);color:var(--panel-ink);display:grid;place-items:center;font-size:.7rem;font-weight:800;box-shadow:0 5px 0 #B98E66,0 10px 20px rgba(0,0,0,.25);position:relative;padding-top:6px}
.round svg{width:30px;height:30px}
.round .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--red);color:#fff;font-size:.8rem;display:grid;place-items:center;padding:0 6px;border:2px solid #fff}
.round:active{transform:translateY(3px);box-shadow:0 2px 0 #B98E66}
.play{pointer-events:auto;border:0;border-radius:24px;padding:14px 26px;font-size:1.3rem;font-weight:900;color:#fff;background:linear-gradient(#7DD27F,#3FA14C);box-shadow:0 6px 0 #2B7536,0 12px 24px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.25);display:grid;line-height:1.1}
.play small{font-size:.72rem;font-weight:500;opacity:.92}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #2B7536}

.hand{position:fixed;z-index:9;width:56px;height:56px;pointer-events:none;animation:tap 1s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
@keyframes tap{50%{transform:translate(-6px,-10px) scale(.92)}}

.dlg{position:fixed;left:10px;right:10px;bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;align-items:flex-end;gap:6px;max-width:560px;margin-inline:auto}
.dlg .face{width:92px;height:108px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.dlg .say{background:var(--panel);color:var(--panel-ink);border-radius:20px 20px 20px 6px;padding:13px 15px;font-size:.96rem;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.3);flex:1;min-width:0;cursor:pointer}
.dlg .say b{display:block;color:#B7652B;font-size:.78rem;margin-bottom:2px}
.dlg .say em{display:block;font-style:normal;font-size:.76rem;color:#9A7B63;margin-top:8px}
.dlg .say .tapnext{display:block;text-align:right;font-size:.7rem;color:#C09A7C;margin-top:4px}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(15,10,6,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--panel);color:var(--panel-ink);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom,0px));max-height:84vh;overflow-y:auto;animation:up .35s cubic-bezier(.2,1,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet h2{margin:0 0 4px;font-size:1.4rem;font-weight:900}
.sub{color:#8D6E57;font-size:.88rem;margin:0 0 14px;line-height:1.4}
.task{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:18px;background:#fff;margin-bottom:10px;box-shadow:0 2px 0 #EAD6BE}
.ti{width:52px;height:52px;border-radius:14px;background:#F6E7D3;display:grid;place-items:center}
.ti svg{width:36px;height:36px}
.task h3{margin:0;font-size:1rem;font-weight:700}
.task p{margin:2px 0 0;font-size:.8rem;color:#8D6E57}
.do{border:0;border-radius:14px;padding:10px 14px;font-weight:800;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(#7DD27F,#3FA14C);color:#fff;box-shadow:0 3px 0 #2B7536}
.do:disabled{background:#E5D6C4;color:#A48A74;box-shadow:0 3px 0 #CDB79F;cursor:default}
.do.gold{background:linear-gradient(#FFD27A,#F4A62A);color:#5A3418;box-shadow:0 3px 0 #C47D12}
.locked{opacity:.55}
.close{display:block;margin:6px auto 0;background:none;border:0;color:#8D6E57;font-weight:500;padding:10px}
.chap{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px;border-radius:18px;background:#fff;margin-bottom:10px;box-shadow:0 2px 0 #EAD6BE;align-items:center}
.chap .ti{width:64px;height:64px}
.chap .ti svg{width:48px;height:48px}
.chap h3{margin:0;font-size:1rem;font-weight:800}
.chap .st{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#4FB35C}
.chap .st.l{color:#B79C86}
.chap p{margin:3px 0 0;font-size:.82rem;color:#8D6E57;line-height:1.35}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.offer{background:#fff;border-radius:18px;padding:14px 10px;display:grid;gap:6px;justify-items:center;text-align:center;box-shadow:0 2px 0 #EAD6BE;position:relative}
.offer.big{grid-column:1/-1;background:linear-gradient(#FFF1D6,#FFE2B0)}
.offer b{font-size:1.05rem}
.offer p{margin:0;font-size:.76rem;color:#8D6E57}
.offer .rib{position:absolute;top:-8px;left:50%;translate:-50% 0;background:var(--red);color:#fff;font-size:.66rem;font-weight:800;padding:2px 10px;border-radius:999px;white-space:nowrap}
.offer .do{width:100%}
.howto{display:grid;gap:12px}
.step{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:12px;box-shadow:0 2px 0 #EAD6BE}
.step .n{width:56px;height:56px;border-radius:16px;background:#F6E7D3;display:grid;place-items:center}
.step .n svg{width:40px;height:40px}
.step b{display:block}
.step span{font-size:.84rem;color:#8D6E57}

.modal{position:fixed;inset:0;z-index:40;background:rgba(10,6,4,.55);display:grid;place-items:center;padding:20px}
.modal .in{background:var(--panel);color:var(--panel-ink);border-radius:28px;padding:24px 20px;max-width:350px;width:100%;text-align:center;display:grid;gap:12px;justify-items:center;animation:pp .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pp{from{transform:scale(.6);opacity:0}}
.modal h2{margin:0;font-size:1.7rem;font-weight:900}
.modal p{margin:0;color:#8D6E57;line-height:1.4}
.reward{display:flex;gap:14px;font-weight:900;font-size:1.4rem;align-items:center}
.reward span{display:flex;align-items:center;gap:6px}
.wide{width:100%;padding:14px}
.ghostb{background:none;border:2px solid #E5D3BD;color:#8D6E57;border-radius:14px;padding:12px;font-weight:700;width:100%}
.goalsrow{display:flex;gap:16px;justify-content:center}
.goalsrow div{display:grid;justify-items:center;font-weight:900;font-size:1.2rem}
.goalsrow svg{width:46px;height:46px}
.boosters{display:flex;gap:10px;width:100%}
.bst{flex:1;border:2px solid #E5D3BD;background:#fff;border-radius:16px;padding:8px;display:grid;justify-items:center;gap:2px;font-size:.78rem;font-weight:700;color:var(--panel-ink)}
.bst svg{width:40px;height:40px}
.bst.on{border-color:var(--green);background:#EAF7EA}
.bst small{color:#8D6E57;font-weight:500}
.float{position:fixed;z-index:6;pointer-events:none;font-weight:900;font-size:1.05rem;color:#FFE08A;text-shadow:0 2px 0 rgba(0,0,0,.55);display:flex;align-items:center;gap:4px;white-space:nowrap}

.styles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
.sopt>svg{width:100%!important;max-width:62px;height:42px!important}
.pvbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--panel);color:var(--panel-ink);border-radius:22px;padding:12px 14px;box-shadow:0 6px 0 #D9BE98,0 16px 40px rgba(60,30,10,.3);width:min(94vw,440px);text-align:center}.pvbar p{margin:0 0 10px;font-weight:700;font-size:.92rem}.pvbar div{display:flex;gap:10px}.pvbar div>*{flex:1;margin:0}
.mats{display:flex;gap:6px;justify-content:center;margin:-2px 0 10px}.mats button{border:2px solid #E5D3BD;border-radius:12px;background:#fff;padding:4px 6px;font:inherit;font-size:.7rem;font-weight:700;color:var(--panel-ink);display:grid;justify-items:center;gap:2px;min-width:62px}.mats button.on{border-color:var(--green);background:#EAF7EA}.mats i{width:26px;height:16px;border-radius:5px;display:block;border:1px solid rgba(0,0,0,.12)}
.sopt{border:2px solid #E5D3BD;background:#fff;border-radius:16px;padding:10px 4px 8px;display:grid;justify-items:center;gap:4px;font-size:.72rem;font-weight:700;color:var(--panel-ink);position:relative;line-height:1.2}
.sopt>svg{width:62px;height:46px}
.sopt .pr svg{width:14px;height:14px}
.sopt.on{border-color:var(--green);background:#EAF7EA}
.sopt .pr{display:inline-flex;align-items:center;gap:3px;font-size:.78rem;color:#8D6E57}
.sopt .pr.free{color:var(--green)}
.sopt .tagp{position:absolute;top:-9px;left:50%;translate:-50% 0;background:#B388EB;color:#fff;font-size:.6rem;padding:1px 7px;border-radius:999px;white-space:nowrap}
.ditem{background:#fff;border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 2px 0 #EAD6BE}
.ditem h3{margin:0 0 12px;font-size:1rem}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:0;border-radius:12px;padding:9px;font-weight:700;background:#F1E2CC;color:#8D6E57}
.tabs button.on{background:var(--panel-ink);color:#fff}
.prow{display:grid;grid-template-columns:28px 40px minmax(0,1fr) auto;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:10px;margin-bottom:8px;box-shadow:0 2px 0 #EAD6BE}
.prow.me{background:#FFF1D6;box-shadow:0 2px 0 #F0C98A}
.prow .rk{font-weight:900;font-size:1.1rem;text-align:center;color:#B79C86}
.prow .rk.g1{color:#E0A100}.prow .rk.g2{color:#9AA4AE}.prow .rk.g3{color:#C47A3E}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;font-size:1.1rem;flex:none}
.prow b{display:block;font-size:.98rem}
.prow small{color:#8D6E57;font-size:.76rem}
.visit{position:fixed;left:50%;top:calc(112px + env(safe-area-inset-top,0px));translate:-50% 0;z-index:6;background:var(--panel);color:var(--panel-ink);border-radius:20px;padding:7px 7px 7px 8px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.3);font-weight:700;font-size:.88rem;white-space:nowrap}
.visit button{border:0;border-radius:12px;padding:8px 12px;font-weight:800}
.like{background:#FFE1E6;color:#C2334B}
.tip{position:fixed;z-index:7;pointer-events:none;background:var(--panel);color:var(--panel-ink);border-radius:14px;padding:10px 12px;max-width:240px;font-size:.8rem;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.tip b{display:block;font-size:.92rem}
.tip em{display:block;font-style:normal;color:#C9601E;font-size:.72rem;margin-top:4px;font-weight:700}
.prev{width:100%;border-radius:18px;overflow:hidden;display:block}
.prev svg{display:block;width:100%;height:auto}

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
var REDUCE=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var sleep=function(ms){return new Promise(function(r){setTimeout(r,REDUCE?0:ms);});};

/* ================= SAVE ================= */
var MAXL=5,LIFE_MS=15*60*1000;
var save={stars:0,coins:200,level:1,done:[],lives:MAXL,lifeT:0,tut:0,introSeen:false,style:{},owned:{},days:0,lastDay:'',plots:[{},{},{},{},{},{}],beans:[0,0,0],chDone:0,world:'valley',res:{milk:0,eggs:0,packs:0},prod:{},trip:null,music:true,sound:true,wins:0,noads:false,ts:0};
try{var sv=JSON.parse(localStorage.getItem('cafe-save3')||'null');if(sv&&sv.level)save=Object.assign(save,sv);}catch(e){}
function migrate(){var d=save.done;if(d.indexOf('s_neon')>-1)['s_walls','s_decor','s_tables'].forEach(function(k){if(d.indexOf(k)<0)d.push(k);});if(d.some(function(k){return k.indexOf('m_')===0;}))['q_pier','q_rods','q_hut','q_boat','q_smoke','q_ice','q_grill','q_menu'].forEach(function(k){if(d.indexOf(k)<0)d.push(k);});save.bought=save.bought||{};if(d.some(function(k){return k.indexOf('s_')===0||k.indexOf('m_')===0;})||save.world==='sea'||save.world==='mount')save.bought.sea=1;if(d.some(function(k){return k.indexOf('m_')===0;})||save.world==='mount')save.bought.mount=1;if(d.indexOf('f_well')>-1)['f_clear','f_pens','f_goats'].forEach(function(k){if(d.indexOf(k)<0)d.push(k);});if(d.indexOf('r_vines')>-1)['n_yard','n_walls','n_win','n_floor','n_kitchen','n_bed','n_tv','n_dog','n_porch','n_move'].forEach(function(k){if(d.indexOf(k)<0)d.push(k);});if(d.indexOf('floor')>-1)['leaves','dust'].forEach(function(k){if(d.indexOf(k)<0)d.push(k);});if(d.indexOf('walls')>-1&&d.indexOf('windows')<0)d.push('windows');}migrate();
function persist(){RB={};LQ.valid=false;if(window.__noSave)return;save.ts=Date.now();try{localStorage.setItem('cafe-save3',JSON.stringify(save));}catch(e){}if(typeof YG!=='undefined'&&YG)YG.save();}
var V={done:save.done,style:save.style},visiting=null;
var has=function(id){return V.done.indexOf(id)>-1;};

/* ================= TASKS ================= */
var TASKS=[
  {id:'trash',name:'Вынести мусор',desc:'Старые коробки и обломки',cost:1,fx:[4,4],say:'Уф, сразу легче дышится! Теперь видно, какой тут огромный зал.'},
  {id:'leaves',name:'Вымести листья',desc:'Ветер годами задувал их через щели',cost:1,fx:[5,5],say:'Целый мешок листьев! Под ними — следы от старых столиков.'},
  {id:'dust',name:'Снять пыльные чехлы и паутину',desc:'Пыль везде: на стенах, стойке и окнах',cost:1,fx:[4,2],say:'Апчхи! Под чехлом — старая стойка. Её ещё можно спасти.'},
  {id:'floor',name:'Отмыть и покрыть пол',desc:'Под пылью — дубовый паркет',cost:1,fx:[5,4],say:'Паркет! Настоящий дубовый. Кто-то когда-то очень любил это место.'},
  {id:'counter',name:'Починить барную стойку',desc:'Без стойки нет кофейни',cost:1,fx:[4,1.5],say:'Стойка как новая. Осталось главное — кофемашина.'},
  {id:'machine',name:'Купить кофемашину',desc:'Открывает продажу эспрессо: придут гости',cost:1,fx:[3.5,1.5],say:'Она работает! Первые гости уже идут на запах. Каждая чашка приносит монеты.'},
  {id:'tables',name:'Поставить столики и ковёр',desc:'Гости садятся и оставляют чаевые',cost:1,fx:[5,5],say:'Теперь людям есть где посидеть. А кот Пончик уже нашёл себе место на ковре.'},
  {id:'sign',name:'Вывеска и меню на доске',desc:'Чтобы с улицы было видно',cost:1,fx:[3,0.5],say:'«Рассвет». Мне кажется, это имя ей подходит.'},
  {id:'walls',name:'Покрасить стены, повесить лампы',desc:'Полки, картины и тёплый свет',cost:1,fx:[2,1],say:'Какой уютный свет! Вечером здесь будет волшебно.'},
  {id:'windows',name:'Отмыть окна',desc:'Чтобы в зал заглядывало солнце',cost:1,fx:[7.5,0.5],say:'Окна сияют! Теперь с улицы видно, что здесь снова живут.'},
  {id:'plants',name:'Расставить растения',desc:'Монстеры и цветы в ящиках на окнах',cost:1,fx:[8,2],say:'Зелень оживила зал. Гости стали задерживаться дольше.'},
  {id:'veranda',name:'Отремонтировать веранду',desc:'Гирлянды, кресла и вид на речку',cost:1,fx:[11.6,4],say:'Веранда с гирляндами! Отсюда видно речку и старую пристань…'},
  {id:'display',name:'Купить витрину с десертами',desc:'Десерт к кофе: чек выше',cost:1,fx:[6.5,1.5],say:'Круассаны, чизкейки, макаруны… Гости берут десерт к каждой второй чашке!'},
  {id:'terrace',name:'Открыть летнюю террасу',desc:'Зонтики, фонари и больше гостей',cost:1,fx:[5,9.5],say:'Терраса открыта! Кофейня ожила. А в теплице за лесом что-то зеленеет…'},
  {id:'gpath',ch:2,name:'Расчистить тропинку к теплице',desc:'Упавшее дерево и колючие кусты',cost:1,fx:[-3,7],say:'Тропинка свободна! Дедушка ходил по ней каждое утро.'},
  {id:'glass',ch:2,name:'Вставить новые стёкла',desc:'Чтобы внутри было тепло и светло',cost:2,fx:[-8.2,4.3],say:'Как она сверкает! Внутри уже теплее, чем на улице.'},
  {id:'water',ch:2,name:'Починить полив',desc:'Бочка для дождевой воды и трубы',cost:2,fx:[-5,2],say:'Кап-кап! Дождевая вода — лучшая для кофейных кустов.'},
  {id:'beds',ch:2,name:'Сделать грядки',desc:'Шесть высоких грядок с землёй',cost:2,fx:[-9.9,4.3],say:'Шесть грядок — шесть будущих урожаев!'},
  {id:'plant',ch:2,name:'Посадить первые кусты',desc:'Открывает посадку: семена вы сажаете сами',cost:2,fx:[-9.9,4.3],say:'Грядки готовы к посадке, а у меня мешочек семян бурбона. Сейчас покажу, как сажать!'},
  {id:'lamps',ch:2,name:'Повесить фитолампы',desc:'Кусты растут на 20% быстрее',cost:1,fx:[-8.2,4.3],say:'Фиолетовый свет — кусты его обожают. Теперь всё растёт быстрее!'},
  {id:'stall',ch:2,name:'Открыть лавку «Свежие зёрна»',desc:'Из урожая в кофейне варится новый кофе',cost:2,fx:[-2.6,9.2],say:'Лавка открыта! Теперь из наших зёрен варится новый кофе — у каждого сорта свой напиток и своя цена. Меню — в «Кофейня → Кофе из своих зёрен».'},
  {id:'garden',ch:2,name:'Огород и скамейка',desc:'Цветы, пугало и место для отдыха',cost:1,fx:[-9,9],say:'Какая красота! Теплица готова.'},
  {id:'f_clear',ch:3,name:'Расчистить двор фермы',desc:'Бурьян, старая телега и ржавые вёдра',cost:1,fx:[30.5,12],say:'Сколько хлама! Зато под бурьяном отличная трава. И старый трактор ещё на ходу — его отмыли и покрасили!'},
  {id:'f_fence',ch:3,name:'Починить забор пастбища',desc:'Чтобы животные не разбежались',cost:2,fx:[30.7,12.2],say:'Крепкий забор — и вороны больше не сидят на столбах!'},
  {id:'f_barn',ch:3,name:'Отремонтировать амбар',desc:'Стены, сеновал, стойла и свежая краска',cost:2,fx:[30.7,4.7],say:'Амбар как с открытки! Сеновал полон душистого сена.'},
  {id:'f_pens',ch:3,name:'Разделить пастбище на загоны',desc:'Навесы, кормушки и поилки для каждого',cost:2,fx:[30.7,12.2],say:'Четыре загона: для коров, коз, овечек и кур. У коз даже есть горка! Осталось пригласить жильцов.'},
  {id:'f_cows',ch:3,name:'Первая корова — Зорька',desc:'Даёт молоко для кофейни',cost:2,fx:[28.9,10.4],say:'Знакомься: Зорька! Когда над загоном появится бидон — нажми на него, чтобы собрать молоко. Ещё коров можно купить на ферме (кнопка с коровой слева).'},
  {id:'f_goats',ch:3,name:'Козочка Белка',desc:'Козье молоко: из него получится латте и сыр',cost:2,fx:[28.9,14],say:'Белка уже забралась на горку! Козье молоко пойдёт в латте, а потом — в сырники и сыр.'},
  {id:'f_sheep',ch:3,name:'Овечка Пушок',desc:'Шерсть: вязаные подстаканники для гостей',cost:2,fx:[32.4,10.4],say:'Пушок такой мягкий! Из шерсти Нина свяжет подстаканники и шарфики — гости покупают их на память.'},
  {id:'f_hens',ch:3,name:'Курятник и курочка Ряба',desc:'Свежие яйца для выпечки',cost:2,fx:[32.4,14],say:'Ко-ко-ко! Ряба снесла первое яичко. Свежие яйца — и выпечка в кофейне вкуснее.'},
  {id:'f_dairy',ch:3,name:'Молочная и сыроварня',desc:'Молоко, яйца и сыр поедут в кофейню',cost:2,fx:[31.9,7.4],say:'Теперь продукты с фермы едут прямо в кофейню. Посмотри «Кофейня» → «Напитки» и «Еда»: там фермерское меню.'},
  {id:'f_well',ch:3,name:'Колодец и поилки',desc:'Ферма готова',cost:1,fx:[29.4,7.6],say:'Ферма ожила! А рядом стоит старый дом Нины… Если его починить, она будет жить рядом с животными.'},
  {id:'n_yard',ch:4,name:'Расчистить двор у дома',desc:'Крапива, обломки и старая ванна',cost:1,fx:[31.5,26],say:'Двор чистый! Теперь видно, какой он большой: тут поместятся и клумбы, и огород.'},
  {id:'n_walls',ch:4,name:'Починить стены и крышу',desc:'Новые доски, обои и тёплый плинтус',cost:2,fx:[31,21.4],say:'Дыры заделаны, на стенах — обои в цветочек. Паутину вымели!'},
  {id:'n_win',ch:4,name:'Новые окна и занавески',desc:'Вместо досок — стекло и цветы на подоконниках',cost:2,fx:[30.6,22.8],say:'Сколько света! На каждом подоконнике — герань.'},
  {id:'n_floor',ch:4,name:'Полы и пёстрые половики',desc:'Новые доски и домотканые коврики',cost:1,fx:[32,23],say:'Новые полы не скрипят, а круглый половик Нина связала сама.'},
  {id:'n_kitchen',ch:4,name:'Кухня с русской печкой',desc:'Печь, буфет с посудой и стол с пирогом',cost:2,fx:[29.5,22],say:'В печке трещат дрова, на столе — пирог. Пахнет как в детстве!'},
  {id:'n_tv',ch:4,name:'Гостиная: диван и телевизор',desc:'Ламповый телевизор, кресло и книжный шкаф',cost:2,fx:[31.7,22.4],say:'Нина обожает смотреть сериалы по вечерам. Телевизор старенький, но показывает отлично!'},
  {id:'n_bed',ch:4,name:'Спальня: кровать с лоскутным одеялом',desc:'Мягкая кровать, тумбочка с лампой и комод',cost:2,fx:[34,22],say:'Лоскутное одеяло Нина шила целую зиму. Теперь ей есть где отдохнуть после фермы.'},
  {id:'n_dog',ch:4,name:'Будка и пёс Барбос',desc:'Верный друг и сторож фермы',cost:2,fx:[34.6,26],say:'Знакомься: Барбос! Нажми на него — он очень любит, когда его гладят.'},
  {id:'n_porch',ch:4,name:'Крыльцо, клумбы и огород',desc:'Скамейка, бельевая верёвка и почтовый ящик',cost:2,fx:[33,25.6],say:'Крыльцо, клумбы, морковка на грядке — настоящий деревенский двор!'},

function wsMult(){return Math.pow(wsC().mult,wsScore());}
function wsOrder(){return Math.min(wsC().cap,Math.round(wsBase()*wsMult()));}
